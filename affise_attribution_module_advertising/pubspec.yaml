name: affise_attribution_module_advertising
description: Affise Attribution advertising module Flutter wrapper.
version: 1.7.14
homepage: https://affise.com
repository: https://github.com/affise/affise-mmp-sdk-flutter
issue_tracker: https://github.com/affise/affise-mmp-sdk-flutter/issues
documentation: https://github.com/affise/affise-mmp-sdk-flutter

platforms:
  android:
  ios:

topics:
  - mobile
  - metrics

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        package: com.affise.affise_attribution_module_advertising
        pluginClass: AffiseAttributionModuleAdvertisingPlugin
      ios:
        pluginClass: AffiseAttributionModuleAdvertisingPlugin
